<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>طلبات الإصلاح والصيانة - شموع الماضي</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f6e56">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --brand-dark:#0b3d2e;
    --brand:#0f6e56;
    --brand-light:#e1f5ee;
    --accent:#d97706;
    --bg:#f4f6f5;
    --card:#ffffff;
    --border:#dfe3e1;
    --text:#1f2a27;
    --muted:#6b7570;
    --danger:#c0392b;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Tahoma, Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
  }
  /* ---------------- شاشة كلمة السر ---------------- */
  #lockScreen{
    position:fixed; inset:0; background:var(--brand-dark);
    display:flex; align-items:center; justify-content:center; z-index:999;
    flex-direction:column; gap:16px; padding:20px;
  }
  #lockScreen .box{
    background:var(--card); border-radius:var(--radius); padding:28px 24px;
    width:100%; max-width:320px; text-align:center; box-shadow:0 8px 30px rgba(0,0,0,.25);
  }
  #lockScreen h2{margin:0 0 6px; font-size:18px; color:var(--brand-dark);}
  #lockScreen p{margin:0 0 16px; font-size:13px; color:var(--muted);}
  #lockScreen input{
    width:100%; padding:12px; font-size:16px; border:1px solid var(--border);
    border-radius:8px; text-align:center; margin-bottom:12px;
  }
  #lockScreen button{
    width:100%; padding:12px; background:var(--brand); color:#fff; border:none;
    border-radius:8px; font-size:15px; font-weight:600; cursor:pointer;
  }
  #lockScreen button:active{opacity:.85;}
  #lockError{color:#ffd7d2; font-size:12px; min-height:16px;}

  /* ---------------- هيدر ---------------- */
  header{
    background:var(--card); border-bottom:1px solid var(--border);
    padding:14px 18px; display:flex; align-items:center; justify-content:space-between;
  }
  .brand-name{font-size:17px; font-weight:700; color:var(--brand-dark);}
  .brand-sub{font-size:11px; color:var(--muted); margin-top:2px;}
  header .logo-slot img{height:48px; width:48px; display:block; object-fit:contain; border-radius:6px;}
  .designer-line{
    text-align:center; font-size:11px; color:var(--muted); padding:6px 0 10px;
    background:var(--card); border-bottom:1px solid var(--border);
  }
  .app-title{
    text-align:center; padding:14px 10px 6px; font-size:19px; font-weight:700; color:var(--brand-dark);
  }

  /* ---------------- تابات ---------------- */
  .tabs{display:flex; gap:0; margin:14px 16px 0; border-bottom:2px solid var(--border);}
  .tab-btn{
    flex:1; padding:12px 8px; text-align:center; background:none; border:none;
    font-size:14px; font-weight:600; color:var(--muted); cursor:pointer; border-bottom:3px solid transparent;
    margin-bottom:-2px;
  }
  .tab-btn.active{color:var(--brand); border-bottom-color:var(--brand);}
  .tab-panel{display:none; padding:16px; max-width:640px; margin:0 auto;}
  .tab-panel.active{display:block;}

  /* ---------------- الفورم ---------------- */
  .card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:18px; margin-bottom:14px;}
  label{display:block; font-size:13px; font-weight:600; color:var(--text); margin-bottom:6px;}
  select, textarea, input[type=number], input[type=text]{
    width:100%; padding:11px; border:1px solid var(--border); border-radius:8px;
    font-size:14px; font-family:inherit; margin-bottom:16px; background:#fff; color:var(--text);
  }
  textarea{min-height:90px; resize:vertical;}
  .status-choice{display:flex; gap:10px; margin-bottom:18px;}
  .status-choice label{
    flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
    border:1px solid var(--border); border-radius:8px; padding:12px 6px; cursor:pointer;
    font-size:13px; font-weight:600; margin:0; color:var(--muted);
  }
  .status-choice input{width:auto; margin:0;}
  .status-choice label.checked-done{border-color:#1d9e75; background:#e1f5ee; color:#0f6e56;}
  .status-choice label.checked-progress{border-color:#ba7517; background:#faeeda; color:#854f0b;}
  #submitBtn{
    width:100%; padding:14px; background:var(--brand); color:#fff; border:none;
    border-radius:8px; font-size:15px; font-weight:700; cursor:pointer;
  }
  #submitBtn:disabled{opacity:.6;}
  #formMsg{text-align:center; font-size:13px; margin-top:10px; min-height:18px;}

  /* ---------------- التقارير ---------------- */
  .reports-toolbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
  .reports-toolbar button{
    padding:9px 14px; border-radius:8px; border:1px solid var(--border); background:#fff;
    font-size:13px; font-weight:600; cursor:pointer; color:var(--text);
  }
  .btn-danger{color:#fff !important; background:var(--danger) !important; border-color:var(--danger) !important;}
  .btn-primary{color:#fff !important; background:var(--brand) !important; border-color:var(--brand) !important;}
  table{width:100%; border-collapse:collapse; background:#fff; border-radius:var(--radius); overflow:hidden; font-size:12.5px;}
  th, td{padding:9px 8px; text-align:right; border-bottom:1px solid var(--border);}
  th{background:var(--brand-light); color:var(--brand-dark); font-size:12px;}
  td.status-done{color:#0f6e56; font-weight:700;}
  td.status-progress{color:#854f0b; font-weight:700;}
  .empty-note{text-align:center; color:var(--muted); padding:30px 10px; font-size:13px;}
  .table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius);}
  #reportsLoading{text-align:center; padding:20px; color:var(--muted); font-size:13px;}
</style>
</head>
<body>

  <!-- شاشة كلمة السر -->
  <div id="lockScreen">
    <div class="box">
      <h2>طلبات الإصلاح والصيانة</h2>
      <p>ادخل كلمة السر للدخول إلى التطبيق</p>
      <input type="password" id="pwdInput" placeholder="كلمة السر" inputmode="numeric">
      <button id="pwdBtn" onclick="checkPassword()">دخول</button>
      <div id="lockError"></div>
    </div>
  </div>

  <!-- الهيدر -->
  <header>
    <div>
      <div class="brand-name">شركة شموع الماضي</div>
      <div class="brand-sub">Shumou Al-Madi</div>
    </div>
    <div class="logo-slot" id="logoSlot"><img src="logo.jpg" alt="شركة شموع الماضي"></div>
  </header>
  <div class="designer-line">تصميم أحمد طه — مكتب نائب الرئيس التنفيذي</div>
  <div class="app-title">طلبات الإصلاح والصيانة</div>

  <!-- التابات -->
  <div class="tabs">
    <button class="tab-btn active" id="tabBtnNew" onclick="switchTab('new')">طلب جديد</button>
    <button class="tab-btn" id="tabBtnReports" onclick="switchTab('reports')">التقارير</button>
  </div>

  <!-- تاب: طلب جديد -->
  <div class="tab-panel active" id="panelNew">
    <div class="card">
      <label for="location">اسم الموقع</label>
      <select id="location">
        <option value="">اختر الموقع...</option>
        <option>مصنع قرمشني</option>
        <option>مصنع الروائع</option>
        <option>مصنع اطايب نجد</option>
        <option>مصنع شعبيات</option>
        <option>مستودع المزرعة</option>
        <option>سكن العمال</option>
        <option>مستودع التسويق</option>
        <option>مستودع المواد الخام</option>
        <option>المستودع العام</option>
      </select>

      <label for="description">وصف العطل / الصيانة المطلوبة</label>
      <textarea id="description" placeholder="اكتب تفاصيل العطل أو الصيانة المطلوبة هنا..."></textarea>

      <label for="value">القيمة</label>
      <input type="number" id="value" placeholder="القيمة بالريال (اختياري)" min="0" step="0.01">

      <label>حالة الطلب</label>
      <div class="status-choice">
        <label id="lblDone">
          <input type="radio" name="status" value="تم التنفيذ" onchange="updateStatusStyle()"> تم التنفيذ
        </label>
        <label id="lblProgress">
          <input type="radio" name="status" value="جارى التنفيذ" onchange="updateStatusStyle()" checked> جارى التنفيذ
        </label>
      </div>

      <button id="submitBtn" onclick="submitRequest()">إرسال الطلب</button>
      <div id="formMsg"></div>
    </div>
  </div>

  <!-- تاب: التقارير -->
  <div class="tab-panel" id="panelReports">
    <div class="reports-toolbar">
      <button class="btn-primary" onclick="loadReports()">تحديث</button>
      <button onclick="deleteSelected()">مسح المحدد</button>
      <button class="btn-danger" onclick="deleteAll()">مسح الكل</button>
      <button onclick="exportExcel()">تصدير Excel</button>
    </div>
    <div id="reportsLoading">جارى تحميل البيانات...</div>
    <div class="table-wrap" id="tableWrap" style="display:none;">
      <table>
        <thead>
          <tr>
            <th><input type="checkbox" id="checkAll" onchange="toggleAll(this)"></th>
            <th>التاريخ</th>
            <th>الموقع</th>
            <th>الوصف</th>
            <th>القيمة</th>
            <th>الحالة</th>
          </tr>
        </thead>
        <tbody id="reportsBody"></tbody>
      </table>
    </div>
    <div class="empty-note" id="emptyNote" style="display:none;">لا توجد طلبات مسجلة حتى الآن</div>
  </div>

<script>
/* =========================================================
   ضع رابط Web App بتاع Google Apps Script هنا (ينتهي بـ /exec)
   ========================================================= */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxD7ihO90a7rBpCImgf7gYLcdt7FHEkbBZ4r9Dkdtx5cWqMmWt1mEUFCE54NhG7oTM0/exec";

let SESSION_PASSWORD = "";
let currentRequests = [];

/* ---------------- كلمة السر ---------------- */
function checkPassword(){
  const val = document.getElementById('pwdInput').value.trim();
  if(val !== "2023"){
    document.getElementById('lockError').textContent = "كلمة السر غير صحيحة";
    return;
  }
  SESSION_PASSWORD = val;
  document.getElementById('lockScreen').style.display = 'none';
}
document.getElementById('pwdInput').addEventListener('keydown', function(e){
  if(e.key === 'Enter') checkPassword();
});

/* ---------------- تبديل التابات ---------------- */
function switchTab(name){
  document.getElementById('panelNew').classList.toggle('active', name === 'new');
  document.getElementById('panelReports').classList.toggle('active', name === 'reports');
  document.getElementById('tabBtnNew').classList.toggle('active', name === 'new');
  document.getElementById('tabBtnReports').classList.toggle('active', name === 'reports');
  if(name === 'reports') loadReports();
}

/* ---------------- تلوين اختيار الحالة ---------------- */
function updateStatusStyle(){
  const done = document.querySelector('input[name=status][value="تم التنفيذ"]').checked;
  document.getElementById('lblDone').classList.toggle('checked-done', done);
  document.getElementById('lblProgress').classList.toggle('checked-progress', !done);
}
updateStatusStyle();

/* ---------------- نداء عام لـ Apps Script ---------------- */
async function callApi(action, extra){
  const payload = Object.assign({ action: action, password: SESSION_PASSWORD }, extra || {});
  const res = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify(payload)
  });
  return res.json();
}

/* ---------------- إرسال طلب جديد ---------------- */
async function submitRequest(){
  const location = document.getElementById('location').value;
  const description = document.getElementById('description').value.trim();
  const value = document.getElementById('value').value;
  const statusEl = document.querySelector('input[name=status]:checked');
  const msg = document.getElementById('formMsg');
  const btn = document.getElementById('submitBtn');

  if(!location){ msg.style.color='#c0392b'; msg.textContent='من فضلك اختر اسم الموقع'; return; }
  if(!description){ msg.style.color='#c0392b'; msg.textContent='من فضلك اكتب وصف العطل أو الصيانة'; return; }

  btn.disabled = true;
  msg.style.color = '#6b7570';
  msg.textContent = 'جارى إرسال الطلب...';

  try{
    const result = await callApi('submit', {
      data: { location: location, description: description, value: value, status: statusEl.value }
    });
    if(result.status === 'ok'){
      msg.style.color = '#0f6e56';
      msg.textContent = 'تم إرسال الطلب بنجاح';
      document.getElementById('location').value = '';
      document.getElementById('description').value = '';
      document.getElementById('value').value = '';
      document.querySelector('input[name=status][value="جارى التنفيذ"]').checked = true;
      updateStatusStyle();
    } else {
      msg.style.color = '#c0392b';
      msg.textContent = result.message || 'حدث خطأ أثناء الإرسال';
    }
  } catch(err){
    msg.style.color = '#c0392b';
    msg.textContent = 'تعذر الاتصال بالخادم. تأكد من اتصال الإنترنت.';
  } finally {
    btn.disabled = false;
  }
}

/* ---------------- تحميل التقارير ---------------- */
async function loadReports(){
  document.getElementById('reportsLoading').style.display = 'block';
  document.getElementById('tableWrap').style.display = 'none';
  document.getElementById('emptyNote').style.display = 'none';

  try{
    const result = await callApi('getAll');
    if(result.status !== 'ok'){
      document.getElementById('reportsLoading').textContent = result.message || 'حدث خطأ';
      return;
    }
    currentRequests = result.data || [];
    renderTable();
  } catch(err){
    document.getElementById('reportsLoading').textContent = 'تعذر الاتصال بالخادم';
  }
}

function renderTable(){
  document.getElementById('reportsLoading').style.display = 'none';
  const body = document.getElementById('reportsBody');
  body.innerHTML = '';

  if(currentRequests.length === 0){
    document.getElementById('emptyNote').style.display = 'block';
    document.getElementById('tableWrap').style.display = 'none';
    return;
  }

  document.getElementById('tableWrap').style.display = 'block';
  currentRequests.forEach(function(r){
    const tr = document.createElement('tr');
    const isDone = r.status === 'تم التنفيذ';
    tr.innerHTML =
      '<td><input type="checkbox" class="rowCheck" data-id="' + r.id + '"></td>' +
      '<td>' + (r.timestamp || '') + '</td>' +
      '<td>' + (r.location || '') + '</td>' +
      '<td>' + (r.description || '') + '</td>' +
      '<td>' + (r.value || '') + '</td>' +
      '<td class="' + (isDone ? 'status-done' : 'status-progress') + '">' + (r.status || '') + '</td>';
    body.appendChild(tr);
  });
}

function toggleAll(box){
  document.querySelectorAll('.rowCheck').forEach(function(c){ c.checked = box.checked; });
}

function getSelectedIds(){
  return Array.from(document.querySelectorAll('.rowCheck:checked')).map(function(c){ return c.dataset.id; });
}

/* ---------------- حذف المحدد / حذف الكل ---------------- */
async function deleteSelected(){
  const ids = getSelectedIds();
  if(ids.length === 0){ alert('اختر طلب واحد على الأقل للحذف'); return; }
  if(!confirm('هل أنت متأكد من مسح ' + ids.length + ' طلب؟')) return;
  await callApi('delete', { ids: ids });
  loadReports();
}

async function deleteAll(){
  if(!confirm('هل أنت متأكد من مسح كل الطلبات؟ لا يمكن التراجع عن هذا الإجراء')) return;
  await callApi('delete', { ids: 'all' });
  loadReports();
}

/* ---------------- تصدير Excel ---------------- */
function exportExcel(){
  if(currentRequests.length === 0){ alert('لا توجد بيانات لتصديرها'); return; }
  const rows = currentRequests.map(function(r){
    return {
      'التاريخ والوقت': r.timestamp,
      'الموقع': r.location,
      'الوصف': r.description,
      'القيمة': r.value,
      'الحالة': r.status
    };
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:18},{wch:22},{wch:40},{wch:12},{wch:14}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'طلبات الصيانة');
  const today = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, 'تقرير_طلبات_الصيانة_' + today + '.xlsx');
}

/* ---------------- تسجيل الـ Service Worker ---------------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
</body>
</html>
